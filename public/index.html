<title>Claude 사무실 관제탑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 왼쪽 층별 안내 · 가운데 아이소메트릭 사무실 · 오른쪽 근무자/활동 로그. 좁으면 세로로 쌓는다. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --ink: #1b2330;
  --muted: #687487;
  --line: #dde3ea;
  --stage: #f4f6f9;
  --accent: #2f6bd8;
  --live: #1fa363;
  --warn: #d48a1c;
  --bad: #d4483b;
  --claude: #d9774f;
  --chip: #eef2f7;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --panel: #171c23; --ink: #e5eaf1; --muted: #8b97a8; --line: #262e39;
    --stage: #12161c; --accent: #6b9cf0; --live: #3cc983; --warn: #e6a640; --bad: #ef6b5e;
    --claude: #e48a63; --chip: #212833; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --panel: #171c23; --ink: #e5eaf1; --muted: #8b97a8; --line: #262e39;
  --stage: #12161c; --accent: #6b9cf0; --live: #3cc983; --warn: #e6a640; --bad: #ef6b5e;
  --claude: #e48a63; --chip: #212833; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 13px; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 316px;
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.panel h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-head { padding: 12px 14px 8px; }

/* 층별 안내 */
.floors .directory { flex: 1; overflow-y: auto; padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.follow { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; letter-spacing: 0; cursor: pointer; }
.follow input { margin: 0; accent-color: var(--accent); }
.floor { display: grid; grid-template-columns: 34px minmax(0, 1fr) 10px; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; }
.floor:hover { background: var(--chip); }
.floor:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.floor.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.floor .fl { font-family: var(--font-mono); font-weight: 600; font-size: 12px; text-align: center; border-radius: 5px; padding: 2px 0; background: var(--chip); color: var(--muted); }
.floor.on .fl { background: color-mix(in srgb, var(--live) 18%, var(--panel)); color: var(--live); }
.floor .fname { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.floor .fmeta { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.floor.off .fname { color: var(--muted); font-weight: 500; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.floor.on .lamp { background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 22%, transparent); }
.dir-foot { border-top: 1px solid var(--line); padding: 8px 14px; color: var(--muted); font-size: 11px; }

/* 무대 */
.stage { position: relative; background: var(--stage); }
.stage-bar { position: absolute; z-index: 2; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.proj { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; display: flex; gap: 10px; align-items: center; min-width: 0; max-width: 72%; pointer-events: auto; flex-wrap: wrap; }
.proj .badge-fl { font-family: var(--font-mono); font-weight: 600; font-size: 11px; color: #fff; background: var(--claude); border-radius: 5px; padding: 2px 6px; }
.proj b { font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj small { color: var(--muted); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); }
.proj > div { min-width: 0; }
.proj-main { display: flex; flex-direction: column; min-width: 0; }
.chip.proj-chip { color: #fff; }
.person .task { font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.proj select { font: inherit; font-weight: 600; font-size: 13px; color: var(--ink); background: transparent; border: 0; padding: 0 2px; margin: 0 0 1px -2px; max-width: 100%; cursor: pointer; }
.proj select:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.proj .follow { font-size: 11px; color: var(--muted); white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.bar-right { display: flex; gap: 6px; align-items: center; pointer-events: auto; }
.side-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.side-btn:hover { background: var(--chip); }
.zoom button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); border-color: var(--accent); color: var(--accent); }
.status { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status.live i { background: var(--live); animation: blink 1.6s infinite; }
.status.demo i { background: var(--warn); }
.status.down i { background: var(--bad); }
@keyframes blink { 50% { opacity: .35; } }
canvas { display: block; width: 100%; height: 100%; }
.empty { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; color: var(--muted); font-size: 12px; text-align: center; max-width: calc(100% - 32px); }

/* 오른쪽 */
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.side .panel { flex: none; }
.side .grow { flex: 1; }
.people { list-style: none; margin: 0; padding: 2px 8px 10px; display: flex; flex-direction: column; gap: 2px; max-height: 40vh; overflow-y: auto; }
.person { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 9px; align-items: start; padding: 7px 6px; border-radius: 8px; }
.person .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11px; }
.person .nm { display: flex; gap: 6px; align-items: center; font-weight: 600; min-width: 0; }
.person .nm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font-size: 10px; font-weight: 600; border-radius: 4px; padding: 1px 5px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.person .act { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.person .cnt { font-family: var(--font-mono); color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.nobody { color: var(--muted); padding: 6px 8px 12px; font-size: 12px; }
.log { list-style: none; margin: 0; padding: 0 8px 10px; overflow-y: auto; flex: 1; font-size: 12px; }
.log li { display: grid; grid-template-columns: 54px 8px minmax(0, 1fr); gap: 7px; padding: 5px 6px; border-bottom: 1px solid var(--line); align-items: baseline; }
.log li:last-child { border-bottom: 0; }
.log time { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log .d { width: 7px; height: 7px; border-radius: 50%; align-self: center; }
.log .t { overflow-wrap: anywhere; }
.log .t b { font-weight: 600; }
.log .err { color: var(--bad); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 4px 14px 12px; font-size: 11.5px; color: var(--muted); }
.legend div { display: flex; gap: 6px; align-items: baseline; }
.legend b { color: var(--ink); font-weight: 600; white-space: nowrap; }

/* 세로 화면이나 좁은 화면: 사무실만 꽉 차게. 근무자·로그는 버튼을 눌렀을 때 오른쪽에 떠서 나온다 */
.app.side-flip .side { display: none; }
.app.side-flip { grid-template-columns: minmax(0, 1fr); }
@media (orientation: portrait), (max-width: 1000px) {
  .app, .app.side-flip { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .app.side-flip .side {
    display: flex; position: fixed; z-index: 5;
    top: calc(env(safe-area-inset-top, 0px) + 70px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    right: max(16px, env(safe-area-inset-right, 0px)); width: min(340px, calc(100vw - 32px));
    overflow-y: auto; filter: drop-shadow(0 8px 24px rgba(0,0,0,.18));
  }
  .people { max-height: none; }
}
canvas { touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.zoom { position: absolute; z-index: 2; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 32px; height: 30px; padding: 0 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.zoom button:hover { background: var(--chip); }
.zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { .status.live i { animation: none; } }
</style>

<div class="app">
  <main class="panel stage" aria-label="사무실">
    <div class="stage-bar">
      <div class="proj">
        <div class="proj-main">
          <b>Claude 사무실</b>
          <small id="projPath"></small>
        </div>
      </div>
      <div class="bar-right">
        <span class="status" id="status"><i></i><span id="statusText">연결 중</span></span>
        <button type="button" class="side-btn" id="sideToggle" aria-pressed="false">근무자·로그</button>
      </div>
    </div>
    <canvas id="cv"></canvas>
    <div class="zoom" aria-label="확대·축소">
      <button type="button" id="zoomIn" aria-label="확대">+</button>
      <button type="button" id="zoomOut" aria-label="축소">−</button>
      <button type="button" id="zoomFit">전체</button>
      <button type="button" id="camFollow" aria-pressed="true">🎥 따라가기</button>
    </div>
    <div class="empty" id="emptyNote" hidden></div>
  </main>

  <aside class="side">
    <section class="panel">
      <div class="panel-head"><h2>근무 중 <span id="peopleCount"></span></h2></div>
      <ul class="people" id="people"></ul>
    </section>
    <section class="panel grow">
      <div class="panel-head"><h2>활동 로그</h2></div>
      <ol class="log" id="log"></ol>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>어디서 무엇을 하나</h2></div>
      <div class="legend">
        <div><b>자료실</b> 파일 읽기·검색</div>
        <div><b>개발실</b> 코드 수정</div>
        <div><b>서버실</b> 명령 실행·git</div>
        <div><b>정보검색실</b> 웹·브라우저</div>
        <div><b>회의실</b> 요청·계획·지시</div>
        <div><b>라운지</b> 대기 (식빵 굽기)</div>
      </div>
    </section>
  </aside>
</div>

<script>
(() => {
'use strict';

// ───────── 좌표계 ─────────
const TW = 56, TH = 28, ZH = 24;           // 타일 폭/높이, 높이 1단위 픽셀
const MAP_W = 22, MAP_H = 16, WALL_H = 2.5;
const iso = (x, y, z = 0) => [(x - y) * TW / 2, (x + y) * TH / 2 - z * ZH];

const ROOMS = {
  library: { name: '자료실',     x0: 0,  y0: 0, x1: 6,  y1: 7 },
  dev:     { name: '개발실',     x0: 6,  y0: 0, x1: 22, y1: 7 },
  hall:    { name: '복도',       x0: 0,  y0: 7, x1: 22, y1: 9 },
  meeting: { name: '회의실',     x0: 0,  y0: 9, x1: 5,  y1: 16 },
  lounge:  { name: '라운지',     x0: 5,  y0: 9, x1: 14, y1: 16 },
  server:  { name: '서버실',     x0: 14, y0: 9, x1: 22, y1: 16 },
};
const DOORS = {
  library: { x: 4,   inY: 6.3 }, dev: { x: 15, inY: 6.3 },
  meeting: { x: 3.5, inY: 9.7 }, lounge: { x: 9.5, inY: 9.7 }, server: { x: 17, inY: 9.7 },
};
const HALL_Y = 8;
const ELEVATOR = { x: 0.7, y: 8 };

function roomAt(x, y) {
  if (y < 7) return x < 6 ? 'library' : 'dev';
  if (y < 9) return 'hall';
  return x < 5 ? 'meeting' : x < 14 ? 'lounge' : 'server';
}
function planPath(from, to) {
  const ra = roomAt(from.x, from.y), rb = roomAt(to.x, to.y);
  if (ra === rb) return [{ x: to.x, y: to.y }];
  const pts = [];
  if (ra !== 'hall') { const d = DOORS[ra]; pts.push({ x: d.x, y: d.inY }, { x: d.x, y: HALL_Y }); }
  if (rb !== 'hall') { const d = DOORS[rb]; pts.push({ x: d.x, y: HALL_Y }, { x: d.x, y: d.inY }); }
  pts.push({ x: to.x, y: to.y });
  return pts;
}

// ───────── 색 ─────────
function shade(hex, amt) {
  const c = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return `rgb(${f(c >> 16)},${f((c >> 8) & 255)},${f(c & 255)})`;
}
const SCENE = {
  light: {
    floor: { library: '#eadcc4', dev: '#e3e8ef', hall: '#f1f2f4', meeting: '#e7e1ee', lounge: '#dbe8db', server: '#dde3e9' },
    grid: 'rgba(30,40,60,0.06)', wall: '#f6f7f9', wallTop: '#cfd5dd', glass: 'rgba(140,175,210,0.16)', rail: 'rgba(90,120,150,0.55)',
    label: 'rgba(40,50,65,0.42)', tag: '#ffffff', tagInk: '#1b2330', bubble: '#ffffff', bubbleInk: '#1b2330', bubbleLine: 'rgba(30,40,60,0.14)',
  },
  dark: {
    floor: { library: '#3a3328', dev: '#29303a', hall: '#22262c', meeting: '#302b38', lounge: '#27332a', server: '#252b32' },
    grid: 'rgba(255,255,255,0.05)', wall: '#323944', wallTop: '#4a5361', glass: 'rgba(120,160,210,0.12)', rail: 'rgba(150,180,215,0.45)',
    label: 'rgba(220,230,240,0.38)', tag: '#232a34', tagInk: '#e5eaf1', bubble: '#232a34', bubbleInk: '#e5eaf1', bubbleLine: 'rgba(255,255,255,0.12)',
  },
};
const SUB_COLORS = ['#3b7ddd', '#16a37a', '#8a5cd6', '#0e9cc4', '#d6528f', '#c98a12', '#3a9e9e'];
let pal = SCENE.light;
function pickPalette() {
  const t = document.documentElement.getAttribute('data-theme');
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  pal = dark ? SCENE.dark : SCENE.light;
}

// ───────── 그리기 도구 ─────────
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
function poly(pts, fill, stroke) {
  ctx.beginPath();
  pts.forEach((p, i) => { const [a, b] = iso(p[0], p[1], p[2] || 0); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); });
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function box(x, y, z, w, d, h, color, alpha = 1) {
  ctx.globalAlpha = alpha;
  poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], shade(color, -0.22));
  poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], shade(color, -0.06));
  poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], shade(color, 0.12));
  ctx.globalAlpha = 1;
}
// +y 면(정면 왼쪽) 위의 사각형: x 구간 [a,b], 높이 [z0,z1]
const faceY = (yy, a, b, z0, z1, fill) => poly([[a, yy, z0], [b, yy, z0], [b, yy, z1], [a, yy, z1]], fill);
// +x 면(정면 오른쪽) 위의 사각형: y 구간 [a,b]
const faceX = (xx, a, b, z0, z1, fill) => poly([[xx, a, z0], [xx, b, z0], [xx, b, z1], [xx, a, z1]], fill);
function lineW(p, q, color, width) {
  const [a, b] = iso(...p), [c, d] = iso(...q);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
}
function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ───────── 가구 배치 ─────────
const OBJECTS = [];   // { key, draw(t), users }
const SPOTS = { library: [], dev: [], meeting: [], lounge: [], server: [], hall: [] };
const add = (key, draw, extra = {}) => { const o = { key, draw, users: 0, ...extra }; OBJECTS.push(o); return o; };
const spot = (room, x, y, face, f, tag) => SPOTS[room].push({ room, x, y, face, f, tag });

function desk(x, y, w, d, top, monitor) {
  const o = add(x + w / 2 + y + d / 2, t => {
    for (const [lx, ly] of [[x + 0.05, y + 0.05], [x + w - 0.12, y + 0.05], [x + 0.05, y + d - 0.12], [x + w - 0.12, y + d - 0.12]]) box(lx, ly, 0, 0.07, 0.07, 0.72, '#8d96a3');
    box(x, y, 0.72, w, d, 0.07, top);
    if (!monitor) return;
    const mx = x + w / 2 - 0.36, my = y + 0.1;
    box(mx + 0.3, my + 0.02, 0.79, 0.12, 0.06, 0.16, '#b9c0c9');
    box(mx, my, 0.95, 0.72, 0.07, 0.48, '#d7dce2');
    const fy = my + 0.07;
    faceY(fy, mx + 0.05, mx + 0.67, 1.0, 1.39, o.users ? '#1d2733' : '#2b333d');
    if (o.users) {
      const r = rand(Math.floor(t * 4) + Math.round(x * 31));
      const cols = ['#7cc4ff', '#f2b36b', '#a5e08a', '#e79ad8', '#d0d7e0'];
      for (let i = 0; i < 6; i++) {
        const z = 1.34 - i * 0.055, ind = (r() * 0.12), len = 0.12 + r() * 0.35;
        lineW([mx + 0.09 + ind, fy, z], [mx + 0.09 + ind + len, fy, z], cols[i % cols.length], 1.4);
      }
    } else {
      lineW([mx + 0.12, fy, 1.2], [mx + 0.3, fy, 1.2], 'rgba(160,180,200,0.35)', 1.2);
    }
  });
  return o;
}
function stool(x, y) { add(x + y - 0.3, () => { box(x - 0.04, y - 0.04, 0, 0.08, 0.08, 0.38, '#7c8592'); box(x - 0.22, y - 0.22, 0.38, 0.44, 0.44, 0.07, '#4b5563'); }); }
function shelfBack(x, y, w) {
  add(x + w / 2 + y + 0.25, () => {
    box(x, y, 0, w, 0.5, 2.1, '#8b6a4b');
    const r = rand(Math.round(x * 97 + 7));
    const books = ['#c9533f', '#3f7cc9', '#e2b13c', '#4e9a6b', '#7e5ab8', '#d9824a', '#2f8f99'];
    for (const z0 of [0.12, 0.62, 1.12, 1.62]) {
      let bx = x + 0.08;
      faceY(y + 0.5, x + 0.05, x + w - 0.05, z0 - 0.04, z0 + 0.42, '#5a4330');
      while (bx < x + w - 0.16) {

    case 'Bash': { const c = cut(inp.command, 34); return { room: 'server', pose: 'type', text: (/^\s*git\b/.test(inp.command || '') ? '🌿 ' : '💻 $ ') + c }; }
    case 'BashOutput': case 'KillShell': case 'KillBash': case 'Monitor': return { room: 'server', tag: 'console', pose: 'type', text: '📟 실행 결과 확인' };
    case 'TodoWrite': case 'TaskCreate': case 'TaskUpdate': return { room: 'meeting', tag: 'board', pose: 'plan', text: '🗒 할 일 정리' + (inp.todos ? ` (${inp.todos}개)` : '') };
    case 'ExitPlanMode': case 'EnterPlanMode': return { room: 'meeting', tag: 'board', pose: 'plan', text: '🗺 계획 세우는 중' };
    case 'SendMessage': return { room: 'meeting', tag: 'board', pose: 'plan', text: '📨 다른 에이전트와 연락' };
    case 'AskUserQuestion': return { room: 'meeting', tag: 'board', pose: 'stuck', text: '🙋 질문 있어요' };
    case 'Skill': return { room: 'library', pose: 'read', text: '📘 스킬 ' + cut(inp.skill, 20) };

}
const TASK_TOOLS = new Set(['Task', 'Agent']);

function pushLog(s, a, text, ts, err) {
  s.log.unshift({ ts, who: a ? a.name + ' · ' + projName(a.project) : '', color: a ? a.color : '#999', text, err });
  if (s.log.length > 250) s.log.length = 250;
}

function resolveActor(s, e) {
  if (!e.agent_id) return mainOf(s, e.sessionId, e.who, e.project);
  let a = s.agents.find(x => x.agentId === e.agent_id && !x.leaving);
  if (!a) {
    const pending = s.agents.filter(x => x.kind === 'sub' && !x.agentId && !x.leaving);
    a = pending.find(x => x.sid === e.sessionId) || pending[0];
    if (!a) { a = makeAgent(s, 'sub', 'agent', null, e.sessionId, e.project, e.sessionId + ':' + e.agent_id); a.orphan = true; }
    a.agentId = e.agent_id;
  }
  a.lastTs = Math.max(a.lastTs, curTs);
  if (!a.handedBack) a.leaveAt = 0; // 아직 일하는 중 (결과를 넘긴 뒤에는 퇴근 예약을 지우지 않는다)
  return a;
}

function handle(e) {
  const s = office();
  const ts = e.ts || Date.now();
  curTs = ts;
  s.lastEvent = Math.max(s.lastEvent, ts);
  if (e.sessionId && !e.agent_id) s.sessionId = e.sessionId;
  dirtyPanels = true;
  switch (e.ev) {
    case 'Prompt': {
      if (e.agent_id) { const a = resolveActor(s, e); a.bubble = '📋 ' + cut(e.text, 40); return; }
      const m = mainOf(s, e.sessionId, e.who, e.project);
      goTo(s, m, 'meeting', 'think', '💬 ' + cut(e.text, 40), 'board');
      m.idleAt = 0; m.task = cut(e.text, 16);
      pushLog(s, m, '요청 받음 · ' + cut(e.text, 80), ts);
      return;
    }
    case 'Command': {
      if (/^\/(exit|quit)$/.test(e.text)) { // 터미널에서 Claude 를 닫으면 바로 퇴근 (이미 퇴근 중이면 새로 만들지 않는다)
        const m = s.agents.find(a => a.kind === 'main' && a.sid === e.sessionId && !a.leaving);
        if (!m) return;
        leave(s, m, '👋 퇴근');
        for (const x of s.agents) if (x.kind === 'sub' && x.sid === e.sessionId) leave(s, x, '👋 퇴근');
        pushLog(s, m, '세션 종료 · 퇴근', ts);
        return;
      }
      const m = mainOf(s, e.sessionId, e.who, e.project);
      if (e.text === '/clear') { m.bubble = '🧹 책상 정리 (/clear)'; pushLog(s, m, '/clear · 새 세션으로 이어서 근무', ts); }
      else pushLog(s, m, '명령 ' + e.text, ts);
      return;
    }
    case 'Thinking': {
      const a = resolveActor(s, e);
      if (!a.path.length) a.pose = 'think'; else a.finalPose = 'think';
      a.bubble = '🤔 고민 중…'; a.idleAt = 0; a.last = now;
      return;
    }
    case 'Text': {
      const a = resolveActor(s, e);
      a.bubble = '💬 ' + cut(e.text, 40); a.last = now;
      if (a.kind === 'main' && a.who !== 'codex') a.idleAt = now + 6; // 말만 하고 도구가 없으면 곧 턴 종료 (Codex 는 끝을 따로 알려준다)
      return;
    }
    case 'PreToolUse': {
      const a = resolveActor(s, e);
      a.tools++; a.idleAt = 0;
      if (TASK_TOOLS.has(e.tool_name)) {
        const inp = e.tool_input || {};
        const type = inp.subagent_type || 'agent';
        goTo(s, a, 'meeting', 'plan', '📣 ' + cut(inp.description || type, 26) + ' 맡김', 'board');
        // 서브에이전트 기록이 먼저 도착해 이름 없이 출근한 애가 있으면 그 애가 이 일을 맡은 것으로 이어 받는다
        const orphan = s.agents.find(x => x.kind === 'sub' && x.orphan && x.sid === e.sessionId && !x.leaving);
        const sub = orphan || makeAgent(s, 'sub', type, null, e.sessionId, a.project || e.project, e.sessionId + ':' + e.tool_use_id);
        if (orphan) { orphan.orphan = false; orphan.name = type; }
        sub.task = cut(inp.description || '', 16);
        sub.toolUseId = e.tool_use_id;
        if (!orphan) {
          goTo(s, sub, 'meeting', 'think', '📋 ' + cut(inp.description || '업무 받는 중', 30));
          sub.bubble = '🛗 출근 · ' + cut(inp.description || type, 26);
        }
        pushLog(s, a, `서브에이전트 ${type} 호출 · ${cut(inp.description, 60)}`, ts);
      } else {
        const d = describe(e.tool_name, e.tool_input);
        // 결과 넘기기는 서브에이전트의 마지막 일. 끝났다는 기록이 늦게 오거나 안 와도 15초 뒤엔 퇴근
        if (a.kind === 'sub' && /handback/i.test(e.tool_name || '')) { a.handedBack = true; a.leaveAt = now + 15; }
        goTo(s, a, d.room, d.pose, d.text, d.tag);
        pushLog(s, a, d.text, ts);
      }
      if (e.tool_use_id) s.tools.set(e.tool_use_id, a);
      return;
    }
    case 'PostToolUse': {
      const a = s.tools.get(e.tool_use_id);
      s.tools.delete(e.tool_use_id);
      // 서브에이전트를 맡긴 도구가 끝남. 백그라운드로 띄운 경우엔 "띄웠다"는 응답만 먼저 오므로
      // 바로 퇴근시키지 않고, 10초 안에 그 서브에이전트가 일을 하면 남겨 둔다
      const sub = s.agents.find(x => x.toolUseId && x.toolUseId === e.tool_use_id && !x.leaving);
      if (sub) sub.leaveAt = now + 10;
      // 결과를 넘긴 서브에이전트는 곧 퇴근
      if (a && a.kind === 'sub' && a.handedBack && !a.leaving) a.leaveAt = now + 3;
      if (a && !a.leaving) {
        if (e.is_error) { a.pose = a.path.length ? a.pose : 'stuck'; a.finalPose = 'stuck'; a.bubble = '😿 실패… ' + a.bubble.replace(/^\S+\s/, ''); pushLog(s, a, '실패 · ' + a.bubble.replace(/^\S+\s/, ''), ts, true); a.thinkAt = now + 3; }
        else a.thinkAt = now + 1.4;
      }
      return;
    }
    case 'Stop': {
      const m = mainOf(s, e.sessionId, e.who, e.project);
      goTo(s, m, 'lounge', 'idle', '🍞 작업 끝 · 다음 지시 대기', 'sofa');
      // Codex 는 codex exec 로 불릴 때마다 새 세션이 생기니, 일을 마치면 잠깐 쉬고 퇴근한다
      if (m.who === 'codex') m.leaveAt = now + 20;
      pushLog(s, m, '작업 끝', ts);
      return;
    }
    case 'Interrupted': {
      const m = mainOf(s, e.sessionId, e.who, e.project);
      goTo(s, m, 'lounge', 'idle', '✋ 중단됨 · 식빵 굽는 중', 'sofa');
      for (const x of s.agents) if (x.kind === 'sub' && x.sid === e.sessionId) leave(s, x);
      pushLog(s, m, '사용자가 중단함', ts);
      return;
    }
  }
}

// ───────── 루프 ─────────
const SPEED = 3.4;
function update(s, dt) {
  for (const a of s.agents) {
    a.alpha = Math.min(1, a.alpha + dt * 2.5);
    if (a.path.length) {
      const p = a.path[0], dx = p.x - a.x, dy = p.y - a.y, dist = Math.hypot(dx, dy);
      const step = SPEED * dt;
      if (Math.abs(dx) + Math.abs(dy) > 0.01) a.dirFront = dx + dy > 0;
      if (Math.abs(dx - dy) > 0.01) a.faceLeft = dx - dy < 0;
      if (dist <= step) { a.x = p.x; a.y = p.y; a.path.shift(); if (!a.path.length) { a.pose = a.finalPose; if (a.leaving) { a.gone = true; s.elevatorUntil = now + 1.2; } } }
      else { a.x += dx / dist * step; a.y += dy / dist * step; }
    } else if (a.leaving) a.gone = true;
    if (a.thinkAt && now > a.thinkAt && !a.path.length) { a.pose = 'think'; a.finalPose = 'think'; a.thinkAt = 0; if (!/^😿/.test(a.bubble)) a.bubble = '🤔 ' + a.bubble.replace(/^\S+\s/, '') ; }
    if (a.idleAt && now > a.idleAt && a.kind === 'main') { a.idleAt = 0; goTo(s, a, 'lounge', 'idle', '🍞 식빵 굽는 중 · 다음 지시 대기', 'sofa'); dirtyPanels = true; }
    a.room = ROOMS[roomAt(a.x, a.y)].name + (a.spot && a.spot.tag === 'web' ? '' : '');
    if (a.spot && a.spot.tag === 'web' && !a.path.length) a.room = '정보검색실';
  }
  const before = s.agents.length;
  s.agents = s.agents.filter(a => !a.gone);
  if (before !== s.agents.length) dirtyPanels = true;
  // 세션마다: 45초 조용하면 라운지로, 15분 조용하면 퇴근 (/clear 로 버려진 세션도 이렇게 정리된다)
  for (const m of s.agents) {
    if (m.leaving || m.path.length) continue;
    if (m.leaveAt && now > m.leaveAt) {
      leave(s, m, m.kind === 'sub' ? '✅ 보고 끝, 퇴근 🛗' : '퇴근 🛗');
      if (m.kind === 'sub') pushLog(s, m, '업무 보고 후 퇴근', Date.now());
      dirtyPanels = true; continue;
    }
    if (m.kind === 'sub') { // 서브에이전트는 90초 동안 아무것도 안 하면 퇴근
      if (Date.now() - m.lastTs > 90000) { leave(s, m, '퇴근 🛗'); dirtyPanels = true; }
      continue;
    }
    const quiet = Date.now() - m.lastTs;
    if (quiet > 15 * 60000) { leave(s, m, '퇴근 🛗'); dirtyPanels = true; }
    else if (quiet > 45000 && m.pose !== 'idle' && !(m.spot && m.spot.room === 'lounge')) { goTo(s, m, 'lounge', 'idle', '🍞 식빵 굽는 중', 'sofa'); dirtyPanels = true; }
  }
}

let view = { scale: 1, ox: 0, oy: 0, dpr: 1 };
function fit() {
  const r = cv.getBoundingClientRect();
  view.dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * view.dpr); cv.height = Math.round(r.height * view.dpr);
  const xs = [iso(0, MAP_H)[0], iso(MAP_W, 0)[0]];
  const top = iso(0, 0, WALL_H + 0.8)[1], bottom = iso(MAP_W, MAP_H)[1];
  const bw = xs[1] - xs[0] + 40, bh = bottom - top + 30;
  const padTop = r.width < 520 ? 70 : 54;
  view.scale = Math.min(r.width / bw, (r.height - padTop) / bh);
  view.ox = r.width / 2 - ((xs[0] + xs[1]) / 2) * view.scale;
  view.oy = padTop + (r.height - padTop) / 2 - ((top + bottom) / 2) * view.scale;

new ResizeObserver(fit).observe(cv);

// 확대·이동: 휠/두 손가락으로 확대, 드래그로 이동, 더블클릭이나 '맞춤'으로 원래대로
const cam = { zoom: 1, panX: 0, panY: 0, auto: true };
const eff = () => ({ s: view.scale * cam.zoom, ox: view.ox * cam.zoom + cam.panX, oy: view.oy * cam.zoom + cam.panY });
function zoomAt(px, py, factor) {
  const E = eff();

  cam.zoom = Math.max(1, Math.min(5, cam.zoom * factor));
  const s2 = view.scale * cam.zoom;
  cam.panX = px - wx * s2 - view.ox * cam.zoom;
  cam.panY = py - wy * s2 - view.oy * cam.zoom;

}
function resetCam() { cam.zoom = 1; cam.panX = 0; cam.panY = 0; setAuto(false); }
function setAuto(on) { cam.auto = on; document.getElementById('camFollow').setAttribute('aria-pressed', String(on)); }
// 따라가기 카메라: 지금 층에 있는 캐릭터들이 다 들어오는 만큼만 확대해서 가운데로 모은다
function autoCamera(s, dt) {
  if (!cam.auto) return;
  const r = cv.getBoundingClientRect();
  let tz = 1, tx = 0, ty = 0;
  const list = s ? s.agents : [];
  if (list.length) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const a of list) {
      const [wx, wy] = iso(a.x, a.y);
      const px = wx * view.scale + view.ox, py = wy * view.scale + view.oy;
      x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py);
    }

    x0 -= 110 * view.scale; x1 += 110 * view.scale; y0 -= head + 40; y1 += 40;
    const top = 64; // 위쪽 막대 자리
    tz = Math.max(1, Math.min(2.6, r.width / (x1 - x0), (r.height - top) / (y1 - y0)));

}
const center = () => { const r = cv.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
cv.addEventListener('wheel', e => {
  e.preventDefault();

const pointers = new Map();
let pinch = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); cv.classList.add('dragging'); });
cv.addEventListener('pointermove', e => {

const endPointer = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) cv.classList.remove('dragging'); };
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

document.getElementById('zoomIn').addEventListener('click', () => { setAuto(false); zoomAt(...center(), 1.4); });
document.getElementById('zoomOut').addEventListener('click', () => { setAuto(false); zoomAt(...center(), 1 / 1.4); });

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function drawOverlays(s, t) {
  const font = getComputedStyle(document.body).getPropertyValue('--font-body');
  const list = [...s.agents].sort((a, b) => (a.x + a.y) - (b.x + b.y));
  const cw = cv.getBoundingClientRect().width, narrow = cw < 560;
  for (const a of list) {
    if (!a.headScreen) continue;
    const E = eff();
    const sx = a.headScreen[0] * E.s + E.ox, sy = a.headScreen[1] * E.s + E.oy;
    const footY = (iso(a.x, a.y)[1]) * E.s + E.oy;
    ctx.globalAlpha = a.alpha;
    // 이름표
    const icon = a.kind === 'main' ? (a.who === 'codex' ? '>_' : '✳') : '↳';
    const tag = `${icon} ${a.name} · ${projName(a.project)}`;
    ctx.font = `600 10px ${font}`;
    const nw = ctx.measureText(tag).width + 12;
    ctx.fillStyle = a.color; roundRect(sx - nw / 2, footY + 5, nw, 15, 7.5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(tag, sx, footY + 16);

      ctx.font = `500 9.5px ${font}`;
      ctx.lineWidth = 3; ctx.strokeStyle = pal.bubble; ctx.strokeText(a.task, sx, footY + 31);
      ctx.fillStyle = pal.bubbleInk; ctx.fillText(a.task, sx, footY + 31);
    }
    // 생각 구름
    if (!a.path.length && (a.pose === 'think' || a.pose === 'stuck')) {
      const k = Math.floor(t * 2.5) % 4;
      ctx.fillStyle = pal.bubble; ctx.strokeStyle = pal.bubbleLine;
      ctx.beginPath(); ctx.arc(sx + 13, sy + 2, 2.5, 0, 7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(sx + 18, sy - 4, 3.5, 0, 7); ctx.fill(); ctx.stroke();
      roundRect(sx + 14, sy - 22, 26, 14, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = a.pose === 'stuck' ? '#d4483b' : pal.bubbleInk;
      ctx.font = `700 11px ${font}`; ctx.fillText(a.pose === 'stuck' ? '!?' : '.'.repeat(k || 1).padEnd(3, ' '), sx + 27, sy - 11.5);
    }
    // 말풍선
    const resting = !a.path.length && a.pose === 'idle' && a.spot && a.spot.room === 'lounge'; // 쉬는 중엔 말풍선 없이 zzz 만
    if (a.bubble && !resting && (!narrow || a.kind === 'main')) {
      ctx.font = `500 11px ${font}`;
      let txt = a.bubble;
      while (ctx.measureText(txt).width > 168 && txt.length > 4) txt = txt.slice(0, -2);
      if (txt !== a.bubble) txt += '…';
      const w = ctx.measureText(txt).width + 14, h = 20, by = sy - 34;
      const bx = Math.max(4, Math.min(cw - w - 4, sx - w / 2));
      ctx.fillStyle = pal.bubble; ctx.strokeStyle = pal.bubbleLine; ctx.lineWidth = 1;
      roundRect(bx, by, w, h, 6); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - 4, by + h); ctx.lineTo(sx, by + h + 5); ctx.lineTo(sx + 4, by + h); ctx.fill();
      ctx.fillStyle = a.kind === 'main' ? a.color : pal.bubbleInk;
      ctx.fillRect(bx, by + 4, 2.5, h - 8);
      ctx.fillStyle = pal.bubbleInk; ctx.textAlign = 'left'; ctx.fillText(txt, bx + 8, by + 14);
    }

  }
}

let floorFlash = { until: 0, text: '' };
function drawFlash(t) {

let lastT = performance.now();
function frame(ts) {
  const dt = Math.min(0.1, (ts - lastT) / 1000); lastT = ts; now += dt;
  for (const s of sessions.values()) update(s, dt);
  const s = selected ? sessions.get(selected) : null;
  autoCamera(s, dt);
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  const E = eff();
  ctx.setTransform(view.dpr * E.s, 0, 0, view.dpr * E.s, E.ox * view.dpr, E.oy * view.dpr);
  drawFloors();
  drawWalls(s, now);
  for (const o of OBJECTS) o.users = 0;
  const items = OBJECTS.map(o => ({ key: o.key, draw: o.draw }));
  if (s) for (const a of s.agents) {
    if (!a.path.length && a.spot && a.spot.f && ['type', 'read', 'think'].includes(a.pose)) a.spot.f.users++;
    const onSofa = !a.path.length && a.spot && a.spot.tag === 'sofa'; // 소파는 통짜라서 앉은 사람을 앞에 그린다
    items.push({ key: a.x + a.y + 0.01 + (onSofa ? 2 : 0), draw: t => { const set = spriteSet(a), pet = !set && petFor(a); set ? drawSprite(a, t, set) : pet ? drawPet(a, t, pet) : drawCat(a, t); } });
  }
  items.sort((p, q) => p.key - q.key);
  for (const it of items) it.draw(now);
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  if (s) drawOverlays(s, now);
  drawFlash(now);
  requestAnimationFrame(frame);
}

const hhmm = ms => { const d = new Date(ms); return d.toTimeString().slice(0, 8); };

let mode = 'live';
function setStatus(kind, text) { const el = $('status'); el.className = 'status ' + kind; $('statusText').textContent = text; }
function setFloors(list) {
  floorsMeta = new Map(list.map(f => [f.key, f]));
  dirtyPanels = true;
}
function startLive() {
  const es = new EventSource('/stream');
  let opened = false;
  es.onmessage = msg => {
    const data = JSON.parse(msg.data);
    if (data.type === 'init') {
      opened = true;
      sessions.clear();
      setFloors(data.floors);
      for (const e of data.events) handle(e);
      for (const s of sessions.values()) {
        settleInstantly(s);
        // 오래 조용했던 층은 퇴근 처리, 나머지는 현재 자세 유지
        if (Date.now() - s.lastEvent > 30 * 60000) s.agents = [];
        else for (const a of s.agents) {
          const quiet = Date.now() - a.lastTs;
          if ((a.kind === 'sub' && quiet > 90000) || quiet > 15 * 60000 || a.leaveAt || a.handedBack) a.gone = true;
        }
        s.agents = s.agents.filter(a => !a.gone);
      }
      reassignChars();
      setStatus('live', 'LIVE');
    } else if (data.type === 'event') handle(data.event);
    else if (data.type === 'floors') setFloors(data.floors);
  };
  es.onerror = () => { if (!opened) { es.close(); startDemo('서버 없음 · 데모'); } else setStatus('down', '재연결 중'); };
  es.onopen = () => { if (opened) setStatus('live', 'LIVE'); };
}
